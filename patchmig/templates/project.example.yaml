# patchmig project configuration.
# Relative paths are resolved against the folder that holds this file.
# Secrets are always references: "env:VAR_NAME" or "file:/path/to/secret", never literal values.
version: 1
name: example-a14-to-a15
workdir: .patchmig

migration:
  source_version: "14"
  target_version: "15"
  # label: mig-A14-A15            # default: mig-A<source>-A<target>

trees:
  source:
    path: /work/oem-a14
    manifest: .repo/manifests/default.xml
    base_ref: android-14.0.0_r1     # unmodified Android base in every project
    head_ref: oem-a14-release       # end of the OEM patches
    # host:                         # optional: Git host of the source repos, for HTTPS fetches
    #   kind: bitbucket_server      # github, gitlab, bitbucket_cloud, bitbucket_server
    #   url: https://bitbucket.oem.example
    #   token: env:SOURCE_GIT_TOKEN
  target:
    path: /work/oem-a15
    manifest: .repo/manifests/default.xml
    base_ref: android-15.0.0_r1
    # remote: aosp                  # for migrate history, when a project has several remotes
    # host:                         # Git host of the target repos (fetch; later also push and PRs)
    #   kind: gitlab
    #   url: https://gitlab.oem.example
    #   token: env:TARGET_GIT_TOKEN
  history_commits: 20000            # target history searched for Google fixes (migrate history)

patch_sources:
  - type: git_range
    projects: all                   # or a list such as [frameworks/base, packages/services/Car]
  # - type: spreadsheet
  #   path: patches.xlsx
  #   columns: {commit: "Commit", project: "Repo", jira: "Ticket"}
  # - type: jira_query
  #   jql: 'project = OEM AND labels = migrate-a15'
  #   attachments: true             # .diff/.patch attachments of the matching tickets
  #   linked_tickets: true          # commit/PR links in the tickets they link to
  # - type: diff_folder
  #   path: diffs/

jira:
  url: https://jira.example.com
  project: OEM
  deployment: auto              # auto (cloud for *.atlassian.net), server or cloud
  user: migration-bot           # basic auth user; Cloud: the account email. Omit for a Bearer PAT
  token: env:JIRA_TOKEN         # Server/DC: personal access token; Cloud: API token
  label_prefix: mig
  comment_marker: "[migration-agent]"   # finds the one comment per ticket to update
  # close_not_needed:             # close tickets a human confirmed are not needed
  #   transition: Close           # workflow transition name in your Jira
  #   resolution: "Won't Do"      # if the transition screen asks for one

# Git hosts that tickets link patches on (commit or PR/merge request links). github.com,
# gitlab.com and bitbucket.org work without an entry for public repositories.
code_hosts: []
#  - url: https://github.example.com
#    kind: github                 # github, gitlab, bitbucket_cloud, bitbucket_server
#    token: env:GITHUB_SOURCE_TOKEN
#    repo_map:                    # host repo -> source tree project
#      oem/platform_frameworks_base: frameworks/base

build:
  transport: ssh                # or 'local' on the build host, with slots: [tree roots]
  ssh:
    host: build01.example.com
    user: builder
    key: file:~/.ssh/build_key
    workdir: /srv/aosp/oem-a15
  lunch_target: aosp_cf_x86_64_auto-trunk_staging-userdebug
  module_build_cmd: "m {modules}"   # only the modules a cluster touches are ever built
  parallelism: 1               # tree slots: workdir, or workdir-1..N
  timeout_minutes: 240
  module_map: {}                # "glob over tree paths": [modules], when Android.bp lookup misses

tests:
  enabled: true
  use_test_mapping: true
  mapping_groups: [presubmit]
  test_cmd: "atest {tests}"
  extra_modules: []
  cuttlefish: false
  baseline: true

llm:
  runtime: copilot-cli
  executable: copilot
  # github_host: oem.ghe.com        # Copilot licence host; empty: github.com
  # github_token: env:COPILOT_PAT   # fine-grained PAT, "Copilot Requests" permission (not ghp_)
  models: {}                        # per agent: intent_writer, cluster_agent, reviewer, build_fixer,
                                    # memory_curator; e.g. {cluster_agent: <model>, intent_writer: <cheaper>}
  credits_per_call: {default: 1.0}  # estimated credits per call by model name; calibrate in the spike
  timeout_seconds: 900

budget:
  run_credits: null                 # cap per run; null = no cap
  cluster_credits: null             # cap per cluster; a cluster over it waits for a decision
  max_fix_attempts: 3               # build-fix rounds per cluster in verify

thresholds:
  quick_approve: 0.85
  careful_review: 0.5

output:
  target: github                    # github, gitlab, bitbucket_cloud, bitbucket_server or gerrit
  branch_prefix: migration/
  draft: true
  github:
    owner: example-oem
    token: env:GITHUB_TOKEN
    repo_map: {}                    # tree project path -> GitHub repo name
    base_branch: oem-a15            # target branch in those repos; PRs go against it
    # api_url: https://github.example.com/api/v3          # GitHub Enterprise
    # git_url: https://github.example.com/{owner}/{repo}.git
    reviewers: []
  # gitlab:                         # same fields for gitlab, bitbucket_cloud, bitbucket_server;
  #   owner: android/oem            # url, user and token default to trees.target.host
  #   repo_map: {}
  #   base_branch: oem-a15

path_rules: []
#  - pattern: "vendor/qcom/**"
#    rule: overlay_only
#    reason: QSSI files change only through overlays

analysis:
  max_cluster_patches: 15       # larger clusters are split at their weakest links
  max_cluster_projects: 3
  hot_spot_min_patches: 3

migrate:
  agent: true                   # call the cluster agent when cherry-pick and net diff fail
  review: true                  # independent reviewer for agent-made changes
  guardrail_retries: 1          # agent retries with feedback after a guardrail failure
  max_change_ratio: 3.0         # agent change at most 3x the net diff's changed lines...
  min_change_lines: 40          # ...but always at least this many

memory:
  path: null                    # local clone of the memory repo; memory record creates it
  brief_max_chars: 4000         # memory text per cluster in the agent's brief
  max_lessons: 5                # lessons the curator may propose per run
