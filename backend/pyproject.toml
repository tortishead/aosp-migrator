[project]
name = "aosp-migrator"
version = "0.1.0"
description = "Web tool to migrate OEM AOSP patches between Android versions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aosp-migrator = "aosp_migrator.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
